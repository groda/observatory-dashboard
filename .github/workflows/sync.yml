name: Update Dashboard

# Concurrency ensures that only one "Update Dashboard" run happens at a time
concurrency:
  # The 'group' defines what runs belong together (Workflow Name + Branch)
  group: ${{ github.workflow }}-${{ github.ref }}
  # If a new run starts while an old one is still running, kill the old one
  cancel-in-progress: true
  
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # This grants the Action permission to push commits
  
jobs:
  observe_and_visualize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Viz Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # This extra line ensures the 'kaleido' binary is in the system path
          pip install --upgrade kaleido==0.2.1
      
      - name: Execute Dashboard
        run: |
          papermill dashboard.ipynb dashboard.ipynb

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add dashboard.ipynb dashboard_preview.png
          
          # Commit only if there are changes (the || exit 0 prevents failure if nothing changed)
          git commit -m "update: dashboard and preview image" || exit 0

          # REBASE: If the remote moved forward while we were running, 
          # this pulls those changes and puts our new commit on top of them.
          git pull --rebase origin main
          
          git push
